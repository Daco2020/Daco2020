name: 블로그 최신 글 갱신

on:
  schedule:
    - cron: "0 0 * * *"      # 매일 09:00 KST
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: og:image 내려받아 README 갱신
        run: python3 scripts/update_blog.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/blog
          git diff --staged --quiet || git commit -m "블로그 최신 글 갱신"
          git push
